name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/delete-selected-chunk-entities

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        shell: pwsh
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370'
      - uses: jurplel/install-qt-action@v4
        with:
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          version: '6.11.1'
          arch: win64_mingw
          modules: qtshadertools qtimageformats
          tools: tools_mingw1310,qt.tools.win64_mingw1310
      - uses: jurplel/install-qt-action@v4
        with:
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          version: '6.11.1'
          target: android
          arch: android_arm64_v8a
          modules: qtshadertools qtimageformats
      - name: Build signed APK
        shell: pwsh
        run: |
          Get-Command g++ | Out-Null
          $qtRoot = Split-Path $env:QT_ROOT_DIR -Parent
          & (Join-Path $qtRoot 'mingw_64\bin\lupdate.exe') -no-obsolete -no-ui-lines -recursive ./src -ts translations/zh_CN.ts translations/en.ts
          if ($LASTEXITCODE -ne 0) { throw 'Translation update failed.' }
          $ndkRoot = Join-Path $env:ANDROID_SDK_ROOT 'ndk\30.0.16248370'
          $keystore = Join-Path $env:RUNNER_TEMP 'bedrockmap-ci.p12'
          $credentials = Join-Path $env:RUNNER_TEMP 'bedrockmap-ci.properties'
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          keytool -genkeypair -storetype PKCS12 -keystore $keystore -storepass $password -keypass $password -alias bedrockmap -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=BedrockMap CI'
          if ($LASTEXITCODE -ne 0) { throw 'Keystore generation failed.' }
          [IO.File]::WriteAllText($credentials, "storePassword=$password`nkeyPassword=$password`n")
          New-Item -Path dist -ItemType Directory -Force | Out-Null
          ./scripts/build_android.ps1 -QtRoot $qtRoot -SdkRoot $env:ANDROID_SDK_ROOT -NdkRoot $ndkRoot -JavaRoot $env:JAVA_HOME -CompileSdk '37.0' -Jobs 2 -KeystorePath $keystore -KeystoreCredentials $credentials
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockMap-Android-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
